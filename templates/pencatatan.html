{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h3 style="margin-bottom: 16px;">Tambah Transaksi Baru</h3>
    <form action="/tambah" method="POST">
        <div class="form-group">
            <label>Tipe Transaksi</label>
            <select name="tipe" required>
                <option value="pengeluaran">Pengeluaran</option>
                <option value="pemasukan">Pemasukan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nominal (Rp)</label>
            <input type="number" id="inputNominal" name="nominal" placeholder="Contoh: 50000" min="1" required>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select name="kategori" required>
                <optgroup label="Pengeluaran">
                    {% for kat in kategori.pengeluaran %}
                    <option value="{{ kat }}">{{ kat }}</option>
                    {% endfor %}
                </optgroup>
                <optgroup label="Pemasukan">
                    {% for kat in kategori.pemasukan %}
                    <option value="{{ kat }}">{{ kat }}</option>
                    {% endfor %}
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>Catatan</label>
            <input type="text" name="catatan" placeholder="Keterangan singkat (misal: Belanja Bulanan)">
        </div>

        <button type="submit" class="btn-submit btn-primary" style="cursor: pointer;">Simpan Transaksi</button>
    </form>
</div>

<!-- Skrip Mengisi Nominal Otomatis Jika Dikirim dari Menu Scan -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const nominalOCR = urlParams.get('nominal');

        if (nominalOCR && nominalOCR !== '0') {
            const inputNominal = document.getElementById('inputNominal');
            inputNominal.value = nominalOCR;
            inputNominal.focus();
        }
    });
</script>
{% endblock %}
