{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h3 style="margin-bottom: 16px;">Tambah Transaksi Baru</h3>
    <form action="/tambah" method="POST">
        <div class="form-group">
            <label>Tipe Transaksi</label>
            <select id="selectTipe" name="tipe" required onchange="updateKategoriOptions()">
                <option value="pengeluaran">Pengeluaran</option>
                <option value="pemasukan">Pemasukan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nominal (Rp)</label>
            <input type="number" id="inputNominal" name="nominal" placeholder="Contoh: 50000" min="1" required>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="selectKategori" name="kategori" required>
                <!-- Opsi diisi otomatis via JavaScript -->
            </select>
        </div>

        <div class="form-group">
            <label>Catatan</label>
            <input type="text" name="catatan" placeholder="Keterangan singkat (misal: Belanja Bulanan)">
        </div>

        <button type="submit" class="btn-submit btn-primary" style="cursor: pointer;">Simpan Transaksi</button>
    </form>
</div>

<script>
    // Membungkus sintaks Jinja2 dengan string agar tidak di-flag error oleh VS Code
    const dataKategori = JSON.parse('{{ kategori | tojson | safe }}');

    function updateKategoriOptions() {
        const tipe = document.getElementById('selectTipe').value;
        const selectKategori = document.getElementById('selectKategori');

        selectKategori.innerHTML = '';

        const opsiTersedia = dataKategori[tipe] || [];

        opsiTersedia.forEach(kat => {
            const option = document.createElement('option');
            option.value = kat;
            option.textContent = kat;
            selectKategori.appendChild(option);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateKategoriOptions();

        const urlParams = new URLSearchParams(window.location.search);
        const nominalOCR = urlParams.get('nominal');

        if (nominalOCR && nominalOCR !== '0') {
            const inputNominal = document.getElementById('inputNominal');
            inputNominal.value = nominalOCR;
            inputNominal.focus();
        }
    });
</script>
{% endblock %}
